name: dbaas_update_tests

on:
  workflow_dispatch:
  schedule:
    # at 08:00 every day.
    - cron: "0 8 * * *"

jobs:
  dbaas_Update_Tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/element_realm_tests.yml
    with:
      element: dbaas
      update: true
    secrets: inherit
