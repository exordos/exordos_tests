name: mailaas_tests

on:
  workflow_dispatch:
  schedule:
    # at 05:00 every day.
    - cron: "0 5 * * *"

jobs:
  mailaas_Tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/element_realm_tests.yml
    with:
      element: mailaas
    secrets: inherit
