name: element_bootstrap_tests

on:
  workflow_call:
    inputs:
      element:
        description: Element to test
        required: true
        type: string
      update:
        description: Test an update from the previous stable release to latest
        type: boolean
        default: false
      free-disk-space:
        description: Free disk space before bootstrapping large elements
        type: boolean
        default: false
    secrets:
      VM_IMPORT_URL:
        required: false

env:
  PACKER_VERSION: "1.9.2"
  CORE_ENDPOINT_URL: http://10.20.0.2:80/api/core
  CORE_USERNAME: "admin"
  CORE_PASSWORD: "admin"
  ELEMENT_NAME: ${{ inputs.element }}
  BASE_CORE_VERSION: latest

jobs:
  Test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Remaining Disk Space
        if: ${{ inputs.free-disk-space }}
        run: df -h
      - name: Free Disk Space (Ubuntu)
        if: ${{ inputs.free-disk-space }}
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          # Set to true to delete tools you do not need
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Check Remaining Disk Space
        if: ${{ inputs.free-disk-space }}
        run: df -h
      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Install exordos
        run: curl -fsSL https://repo.exordos.com/install.sh | sh
      - name: Resolve previous and latest releases
        if: ${{ inputs.update }}
        run: |
          python3 .github/scripts/resolve-update-versions.py "$ELEMENT_NAME" >> "$GITHUB_ENV"
      - name: Select bootstrap version
        if: ${{ inputs.update }}
        run: echo "BASE_CORE_VERSION=$BASE_ELEMENT_VERSION" >> "$GITHUB_ENV"
      - name: Install hypervisor
        run: |
          set -eux

          exordos bootstrap -i $BASE_CORE_VERSION -m core --download-only > prefetch.log 2>&1 &
          PREFETCH_PID=$!

          EXORDOS_BIN=$(which exordos)
          sudo $EXORDOS_BIN compute hypervisors init --connection-uri qemu+tcp://10.20.0.1/system
          sudo chmod 666 /dev/kvm

          wait $PREFETCH_PID || { cat prefetch.log; exit 1; }
          cat prefetch.log
      - name: set exordos config
        run: |
          exordos settings set-realm default --endpoint $CORE_ENDPOINT_URL
          exordos settings set-context default --name default --user $CORE_USERNAME --password $CORE_PASSWORD
      - name: Bootstrap exordos_core
        run:
          exordos bootstrap -i $BASE_CORE_VERSION -f -m core --admin-password $CORE_PASSWORD --cidr 10.20.0.0/22
      - name: Verify core release
        timeout-minutes: 10
        run: .github/scripts/wait-for-element.sh core 540 "" "${BASE_ELEMENT_VERSION:-}" --show
      - name: Set hypervisor with overbooking
        run: |
          HYPER_UUID="$(exordos c h l -o json | jq -r .[0]."uuid")"
          exordos compute hypervisors update $HYPER_UUID --cores-ratio 10.0 --ram-ratio 10.0
      - name: Install latest release
        if: ${{ !inputs.update }}
        timeout-minutes: 11
        run: |
          .github/scripts/install-element.sh "$ELEMENT_NAME" "" 600
          exordos e e l
      - name: Refresh repository
        if: ${{ inputs.update }}
        timeout-minutes: 10
        run: .github/scripts/wait-for-repo-version.sh "$TARGET_ELEMENT_VERSION" 540 "$ELEMENT_NAME"
      - name: Update to latest release
        if: ${{ inputs.update }}
        run: exordos e e update "$ELEMENT_NAME" -v "$TARGET_ELEMENT_VERSION" -y
      - name: Verify latest release
        if: ${{ inputs.update }}
        timeout-minutes: 15
        run: |
          set -eux
          .github/scripts/wait-for-element.sh "$ELEMENT_NAME" 840 "$BASE_ELEMENT_VERSION" "$TARGET_ELEMENT_VERSION" --show
      - name: Push test results to VictoriaMetrics
        if: ${{ always() }}
        continue-on-error: true
        env:
          VM_IMPORT_URL: ${{ secrets.VM_IMPORT_URL }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/push-test-metrics.sh "${{ job.status }}"
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: ${{ inputs.update && 30 || 15 }}
