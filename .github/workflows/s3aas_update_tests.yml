name: s3aas_update_tests

on:
  workflow_dispatch:
  schedule:
    # at 07:00 every day.
    - cron: "0 7 * * *"

jobs:
  s3aas_Update_Tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/element_realm_tests.yml
    with:
      element: s3aas
      update: true
    secrets: inherit
