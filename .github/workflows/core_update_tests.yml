name: core_update_tests

on:
  # TEMPORARY, for the empty_element_tests spike: push and cron are commented
  # out so a push to this branch runs empty_element_tests alone instead of
  # building five stands. Uncomment both before this branch merges.
  # push:
  workflow_dispatch:
  # schedule:
  # at 02:00 every day.
  #   - cron: "0 2 * * *"

env:
  PACKER_VERSION: "1.9.2"
  CORE_ENDPOINT_URL: http://10.20.0.2:80/api/core
  CORE_USERNAME: "admin"
  CORE_PASSWORD: "admin"
  ELEMENT_NAME: core
  BASE_CORE_VERSION: 0.2.29


jobs:
  Core_Tests:
    runs-on: ubuntu-24.04
    if : ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Install exordos
        run: curl -fsSL https://repo.exordos.com/install.sh | sh
      - name: Install hypervisor
        run: |
          set -eux
          
          exordos bootstrap -i $BASE_CORE_VERSION -m core --download-only > prefetch.log 2>&1 &
          PREFETCH_PID=$!
          
          EXORDOS_BIN=$(which exordos)
          sudo $EXORDOS_BIN compute hypervisors init --connection-uri qemu+tcp://10.20.0.1/system
          sudo chmod 666 /dev/kvm
          
          wait $PREFETCH_PID || { cat prefetch.log; exit 1; }
          cat prefetch.log
      - name: set exordos config
        run: |
          exordos settings set-realm default --endpoint $CORE_ENDPOINT_URL
          exordos settings set-context default --name default --user $CORE_USERNAME --password $CORE_PASSWORD
      - name: Bootstrap exordos_core
        run:
          exordos bootstrap -i $BASE_CORE_VERSION -f -m core --admin-password $CORE_PASSWORD --cidr 10.20.0.0/22
      - name: Wait for Exordos Core API
        run: |
          for i in {1..60}; do
            if exordos ready_api; then
              echo "Exordos Core API is ready"
              break
            fi
            echo "Waiting for Exordos Core API... ($i/60)"
            sleep 5
          done
      - name: Set hypervisor with overbooking
        run: |
          HYPER_UUID="$(exordos c h l -o json | jq -r .[0]."uuid")"
          exordos compute hypervisors update $HYPER_UUID --cores-ratio 10.0 --ram-ratio 10.0
      - name: update exordos_core
        run: exordos e e update $ELEMENT_NAME -y
      - name: sleep
        run: sleep 30
      - name: Wait for Exordos Core API
        run: |
          for i in {1..60}; do
            if exordos ready_api; then
              echo "Exordos Core API is ready"
              break
            fi
            echo "Waiting for Exordos Core API... ($i/60)"
            sleep 5
          done
      - name: check exordos core version
        timeout-minutes: 5
        run: |
          set -eux

          .github/scripts/wait-for-element.sh "$ELEMENT_NAME" 240 "$BASE_CORE_VERSION"
          
          exordos e e show $ELEMENT_NAME
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 30
