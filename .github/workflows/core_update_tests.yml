name: core_update_tests

on:
  workflow_dispatch:
  schedule:
    # at 02:00 every day.
    - cron: "0 2 * * *"

jobs:
  Core_Tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/element_bootstrap_tests.yml
    with:
      element: core
      update: true
    secrets: inherit
