name: empty_element_tests

on:
  workflow_dispatch:
  schedule:
    # at 06:00 every day.
    - cron: "0 6 * * *"

jobs:
  Empty_Element_Tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/element_realm_tests.yml
    with:
      element: empty
    secrets: inherit
