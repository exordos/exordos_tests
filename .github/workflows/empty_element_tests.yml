name: empty_element_tests

on:
  workflow_dispatch:
  schedule:
    # at 06:00 every day.
    - cron: "0 6 * * *"

env:
  PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
  USERNAME: ${{ secrets.TEST_USERNAME }}
  USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
  ENDPOINT: https://exordos.com/api/core
  ELEMENT_NAME: empty
  REALM_TTL_HOURS: "2"

jobs:
  Empty_Element_Tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Install exordos
        run: curl -fsSL https://repo.exordos.com/install.sh | sh
      - name: get_realm
        timeout-minutes: 15
        run: |
          set -euo pipefail

          REALM_NAME="empty-${{ github.run_id }}"
          echo "REALM_NAME=$REALM_NAME" >> "$GITHUB_ENV"

          # A key of this run's own, so the realm can be reached over ssh.
          SSH_KEY="$RUNNER_TEMP/realm_key"
          ssh-keygen -q -t ed25519 -N "" -f "$SSH_KEY"
          echo "SSH_KEY=$SSH_KEY" >> "$GITHUB_ENV"

          got="$(SSH_PUBLIC_KEY="$SSH_KEY.pub" \
              .github/scripts/get-realm.sh "$REALM_NAME" "$REALM_TTL_HOURS")"

          echo "::add-mask::$(echo "$got" | sed -n 's/^ADMIN_PASSWORD=//p')"
          echo "$got" >> "$GITHUB_ENV"
          echo "$got" | grep -v '^ADMIN_PASSWORD='
      - name: wait_for_realm_api
        timeout-minutes: 10
        run: |
          set -uo pipefail

          for i in $(seq 1 60); do
              for scheme in https http; do
                  url="$scheme://$REALM_DOMAIN/api/core"
                  if exordos --endpoint "$url" --user admin \
                             --password "$ADMIN_PASSWORD" \
                             ready_api > /dev/null 2>&1; then
                      echo "REALM_CORE_URL=$url" >> "$GITHUB_ENV"
                      echo "The realm's core answered at $url"
                      exit 0
                  fi
              done
              echo "Waiting for the realm's core api... ($i/60)"
              sleep 5
          done

          echo "The realm's core answered on neither https nor http at" >&2
          echo "$REALM_DOMAIN. The per-realm ingress forwards 80 and 443 to" >&2
          echo "the nested core, so check the realm's border and the shared" >&2
          echo "load balancer." >&2
          exit 1
      - name: check_ssh_connection
        timeout-minutes: 15
        run: |
          set -uo pipefail

          # A claimed realm booted before the key was supplied: the ecosystem
          # delivers it afterwards as an ssh_key secret in the realm's own
          # core, and the realm's agent writes it to authorized_keys, so it
          # can take a while to be accepted.

          ssh_info="$(exordos --endpoint "$ENDPOINT" --project-id "$PROJECT_ID" \
              --user "$USERNAME" --password "$USER_PASSWORD" \
              realms ssh_connection "$REALM_UUID" -o json)"
          ssh_host="$(echo "$ssh_info" | jq -r '.[] | select(.field == "host") | .value')"
          ssh_port="$(echo "$ssh_info" | jq -r '.[] | select(.field == "port") | .value')"

          # Stop on a deadline, not a count, so the diagnostics below still
          # run inside the step's timeout however long each attempt takes.
          start=$SECONDS
          i=0
          while [ $((SECONDS - start)) -lt 600 ]; do
              i=$((i + 1))
              if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                     -o BatchMode=yes -o ConnectTimeout=10 -i "$SSH_KEY" \
                     -p "$ssh_port" "ubuntu@$ssh_host" true; then
                  echo "The realm takes the run's key at $ssh_host:$ssh_port" \
                       "after $((SECONDS - start))s"
                  exit 0
              fi
              echo "Waiting for ssh to the realm... (attempt $i, $((SECONDS - start))s)"
              sleep 10
          done

          echo "The realm did not take the run's ssh key" >&2

          # Which half of the delivery broke: the ecosystem writes one ssh_key
          # secret per node the realm's own core lists, and the realm's agent
          # writes that to authorized_keys on the node ssh lands on.
          child=(exordos --endpoint "$REALM_CORE_URL" --user admin
                 --password "$ADMIN_PASSWORD")
          echo "::group::Nodes of the realm's own core"
          "${child[@]}" compute nodes list || true
          echo "::endgroup::"
          echo "::group::ssh_key secrets in the realm's own core"
          "${child[@]}" secret ssh_keys list || true
          echo "::endgroup::"
          echo "::group::Verbose ssh attempt"
          ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ConnectTimeout=10 -i "$SSH_KEY" \
              -p "$ssh_port" "ubuntu@$ssh_host" true 2>&1 | tail -30 || true
          echo "::endgroup::"
          exit 1
      - name: point_cli_at_the_realm
        run: |
          set -euo pipefail

          exordos settings set-realm default --endpoint "$REALM_CORE_URL"
          exordos settings set-context default --name default \
              --user admin --password "$ADMIN_PASSWORD"
      - name: install_element
        run: |
          set -eux

          exordos e e install "$ELEMENT_NAME"
      - name: check_element
        timeout-minutes: 10
        run: |
          set -eux

          .github/scripts/wait-for-element.sh "$ELEMENT_NAME" 540

          exordos e e show "$ELEMENT_NAME"
          exordos e e l
      - name: Push test results to VictoriaMetrics
        if: ${{ always() }}
        continue-on-error: true
        env:
          VM_IMPORT_URL: ${{ secrets.VM_IMPORT_URL }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/push-test-metrics.sh "${{ job.status }}"
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 15
      - name: delete_realm
        if: ${{ always() }}
        run: |
          set -eux

          # Fall back to the name: an ordered realm that never came up leaves
          # get-realm.sh without printing its uuid, and it has no TTL.
          realm="${REALM_UUID:-${REALM_NAME:-}}"
          if [ -z "$realm" ]; then
              echo "No realm was claimed, nothing to delete"
              exit 0
          fi
          exordos --endpoint "$ENDPOINT" --project-id "$PROJECT_ID" \
              --user "$USERNAME" --password "$USER_PASSWORD" \
              realms delete "$realm"
