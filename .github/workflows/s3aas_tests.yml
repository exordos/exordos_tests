name: s3aas_tests

on:
  workflow_dispatch:
  schedule:
    # at 04:00 every day.
    - cron: "0 4 * * *"

jobs:
  s3aas_Tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/element_realm_tests.yml
    with:
      element: s3aas
    secrets: inherit
