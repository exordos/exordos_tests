name: world_tests

on:
  workflow_dispatch:
  schedule:
    # at 03:00 every day.
    - cron: "0 3 * * *"

jobs:
  World_Tests:
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/element_bootstrap_tests.yml
    with:
      element: world
      free-disk-space: true
    secrets: inherit
